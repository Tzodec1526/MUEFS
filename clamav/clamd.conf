# Internal scanner for the 100 MiB upload limit. Keep scan limits explicit.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
LogTime yes
LogFile /var/log/clamav/clamd.log
StreamMaxLength 100M
MaxFileSize 101M
PCREMaxFileSize 101M
MaxScanSize 400M
MaxScanTime 25000
AlertExceedsMax yes
