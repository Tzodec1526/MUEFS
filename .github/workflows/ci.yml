name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: |
          cd backend
          ruff check app/ tests/ run_demo.py
      - name: Type check with mypy
        run: |
          cd backend
          mypy app/ run_demo.py

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: muefs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MUEFS_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test-only@localhost:5432/muefs_test
      MUEFS_TEST_S3_ENDPOINT: http://127.0.0.1:7070
      MUEFS_TEST_S3_ACCESS_KEY: muefs-storage-test
      MUEFS_TEST_S3_SECRET_KEY: disposable-storage-test-password
      MUEFS_TEST_CLAMAV_PORT: "3310"
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable storage and scanner
        run: |
          docker run --rm --detach --name muefs-test-storage \
            --publish 127.0.0.1:7070:7070 --volume muefs-test-storage:/data \
            --env ROOT_ACCESS_KEY="$MUEFS_TEST_S3_ACCESS_KEY" \
            --env ROOT_SECRET_KEY="$MUEFS_TEST_S3_SECRET_KEY" --env VGW_HEALTH=/health \
            versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
            posix /data
          docker run --rm --detach --name muefs-test-clamav \
            --publish 127.0.0.1:3310:3310 --env CLAMAV_NO_FRESHCLAMD=true \
            --volume "$PWD/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" \
            --volume "$PWD/clamav/muefs-limits.cdb:/var/lib/clamav/muefs-limits.cdb" \
            clamav/clamav:1.4@sha256:b25d9199257ae7ef45e0cc4c7eaa60ce7e5447796f0090d5ff311d1a30980cc3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: Wait for storage and scanner
        run: |
          for attempt in {1..180}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:7070/health \
                && python -c "import socket; s = socket.create_connection(('127.0.0.1', 3310), 2); s.sendall(b'zPING\0'); assert s.recv(8).startswith(b'PONG')" 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs muefs-test-storage
          docker logs muefs-test-clamav
          exit 1
      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --tb=short
      - name: Stop storage and scanner
        if: always()
        run: docker rm --force muefs-test-storage muefs-test-clamav || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint
        run: |
          cd frontend
          npm run lint
      - name: Test
        run: |
          cd frontend
          npm run test -- --run
      - name: Build
        run: |
          cd frontend
          npm run build
