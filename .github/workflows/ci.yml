name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: |
          cd backend
          ruff check app/ tests/
      - name: Type check with mypy
        run: |
          cd backend
          mypy app/

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: muefs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MUEFS_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test-only@localhost:5432/muefs_test
      MUEFS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      MUEFS_TEST_S3_ACCESS_KEY: muefs-storage-test
      MUEFS_TEST_S3_SECRET_KEY: disposable-storage-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: Run tests
        # Use a fixed image only as a disposable S3 protocol fixture.
        # Production storage lifecycle and support are deployment responsibilities.
        env:
          MINIO_ROOT_USER: ${{ env.MUEFS_TEST_S3_ACCESS_KEY }}
          MINIO_ROOT_PASSWORD: ${{ env.MUEFS_TEST_S3_SECRET_KEY }}
        run: |
          docker run --rm --detach --name muefs-test-storage \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER --env MINIO_ROOT_PASSWORD \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then
              cd backend
              pytest tests/ -v --tb=short
              exit $?
            fi
            sleep 1
          done
          docker logs muefs-test-storage
          exit 1
      - name: Stop test storage
        if: always()
        run: |
          docker stop muefs-test-storage || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint
        run: |
          cd frontend
          npm run lint
      - name: Test
        run: |
          cd frontend
          npm run test -- --run
      - name: Build
        run: |
          cd frontend
          npm run build
