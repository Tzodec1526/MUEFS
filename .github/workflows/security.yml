name: Security Scan

# Block merges on HIGH/CRITICAL findings in backend deps and repo filesystem.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Trivy filesystem scan (SARIF)
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --format sarif --output trivy-results.sarif --exit-code 1 .
      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit backend dependencies (pip-audit)
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit
          pip-audit --desc on

  npm-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit frontend dependencies (production only)
        run: |
          cd frontend
          npm install
          npm audit --omit=dev --audit-level=high

  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Bandit on backend application code
        run: |
          pip install bandit
          bandit -r backend/app -ll -q
