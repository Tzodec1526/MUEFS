name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (SARIF)
        run: |
          docker run --rm --volume "$PWD:/src" --workdir /src \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --severity HIGH,CRITICAL --format sarif \
            --output trivy-results.sarif --exit-code 1 .
      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit backend dependencies (pip-audit)
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e . aiosqlite -c constraints.txt
          pip install pip-audit==2.10.1 -c constraints.txt
          pip-audit --desc on

  npm-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Audit frontend dependencies (production only)
        run: |
          cd frontend
          npm ci
          npm audit --omit=dev --audit-level=high

  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Bandit on backend application code
        run: |
          pip install bandit==1.9.4 -c backend/constraints.txt
          bandit -r backend/app -ll -q
