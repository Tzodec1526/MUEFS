x-notice-environment: &notice-environment
  EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
  SERVICE_DELIVERY_ENABLED: ${SERVICE_DELIVERY_ENABLED:-false}
  PORTAL_BASE_URL: ${PORTAL_BASE_URL:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_TLS: ${SMTP_TLS:-starttls}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

x-storage-environment: &storage-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://muefs:muefs_dev@postgres:5432/muefs}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-muefs_minio}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-muefs_minio_secret}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-muefs-documents}

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-muefs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muefs_dev}
      POSTGRES_DB: ${POSTGRES_DB:-muefs}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-muefs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis rate limiting
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-muefs_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-muefs_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set muefs http://minio:9000 ${MINIO_ROOT_USER:-muefs_minio} ${MINIO_ROOT_PASSWORD:-muefs_minio_secret};
      mc mb muefs/${S3_BUCKET_NAME:-muefs-documents} --ignore-existing;
      exit 0;
      "

  # Keycloak Identity Provider
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-muefs}
      KC_DB_USERNAME: ${POSTGRES_USER:-muefs}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-muefs_dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: [*notice-environment, *storage-environment]
      DEBUG: ${DEBUG:-true}
      SECURITY_STRICT_STARTUP: ${SECURITY_STRICT_STARTUP:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-muefs}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-muefs-api}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me-in-production}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-secret-in-production}
      # Local stack: true (X-Demo-User-Id). Production deploys: must be false.
      ALLOW_DEMO_MODE: ${ALLOW_DEMO_MODE:-true}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-true}
      PROVISION_USER_ON_FIRST_OIDC_LOGIN: ${PROVISION_USER_ON_FIRST_OIDC_LOGIN:-true}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Optional ClamAV scanning. Off by default; enable with the `security` profile and
      # MALWARE_SCAN_CLAMAV_ENABLED=true (see the clamav service below). Built-in heuristic
      # screening runs regardless.
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      MALWARE_SCAN_CLAMAV_ENABLED: ${MALWARE_SCAN_CLAMAV_ENABLED:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Deletes only draft objects whose removal has committed. Apply migrations first.
  storage-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.storage_cleanup"]
    environment:
      <<: *storage-environment
      DEBUG: ${DEBUG:-true}
      ALLOW_DEMO_MODE: ${ALLOW_DEMO_MODE:-true}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Opt-in notice sender; run migrations and configure the relay before starting it.
  notice-worker:
    profiles: ["email"]
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.notification_worker"]
    environment:
      <<: *notice-environment
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://muefs:muefs_dev@postgres:5432/muefs}
      DEBUG: ${DEBUG:-true}
      ALLOW_DEMO_MODE: ${ALLOW_DEMO_MODE:-true}
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_ALLOW_DEMO_MODE: ${VITE_ALLOW_DEMO_MODE:-true}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-muefs}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-muefs-frontend}

  # Optional malware scanner — opt-in so the default stack stays fast.
  #   docker compose --profile security up   (and set MALWARE_SCAN_CLAMAV_ENABLED=true)
  # First boot downloads the signature database (a few minutes); it persists in a volume.
  clamav:
    image: clamav/clamav:1.4
    profiles: ["security"]
    volumes:
      - clamav_data:/var/lib/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      # The official entrypoint chowns database files, so this mount must allow it.
      - ./clamav/muefs-limits.cdb:/var/lib/clamav/muefs-limits.cdb

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
