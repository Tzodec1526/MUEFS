x-notice-environment: &notice-environment
  EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
  SERVICE_DELIVERY_ENABLED: ${SERVICE_DELIVERY_ENABLED:-false}
  PORTAL_BASE_URL: ${PORTAL_BASE_URL:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_TLS: ${SMTP_TLS:-starttls}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

x-storage-environment: &storage-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://muefs:muefs_dev@postgres:5432/muefs}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://storage:7070}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-muefs_storage}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-muefs_storage_secret}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-muefs-documents}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-muefs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muefs_dev}
      POSTGRES_DB: ${POSTGRES_DB:-muefs}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-muefs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:-muefs_storage}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:-muefs_storage_secret}
      VGW_HEALTH: /health
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:8080}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-muefs}
      KC_DB_USERNAME: ${POSTGRES_USER:-muefs}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-muefs_dev}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build: ./backend
    command: ["python", "-m", "app.seed_data"]
    init: true
    environment:
      <<: *storage-environment
      DEBUG: ${DEBUG:-true}
      ALLOW_DEMO_MODE: ${ALLOW_DEMO_MODE:-true}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: [*notice-environment, *storage-environment]
      DEBUG: ${DEBUG:-true}
      SECURITY_STRICT_STARTUP: ${SECURITY_STRICT_STARTUP:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-muefs}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-muefs-api}
      ALLOW_DEMO_MODE: ${ALLOW_DEMO_MODE:-true}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-true}
      PROVISION_USER_ON_FIRST_OIDC_LOGIN: ${PROVISION_USER_ON_FIRST_OIDC_LOGIN:-true}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DEMO_MODE_SECRET: ${DEMO_MODE_SECRET:-}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      STRICT_MIME_DETECTION: ${STRICT_MIME_DETECTION:-}
      JWT_VERIFY_AUDIENCE: ${JWT_VERIFY_AUDIENCE:-}
      JWT_AUDIENCES: ${JWT_AUDIENCES:-}
      RATE_LIMIT_FAIL_CLOSED: ${RATE_LIMIT_FAIL_CLOSED:-}
      PAYMENTS_ARE_SIMULATED: ${PAYMENTS_ARE_SIMULATED:-true}
      EXTERNAL_PAYMENTS_ENABLED: ${EXTERNAL_PAYMENTS_ENABLED:-false}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      MALWARE_SCAN_CLAMAV_ENABLED: ${MALWARE_SCAN_CLAMAV_ENABLED:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

  storage-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.storage_cleanup"]
    init: true
    environment:
      <<: *storage-environment
      DEBUG: ${DEBUG:-true}
      ALLOW_DEMO_MODE: ${ALLOW_DEMO_MODE:-true}
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy

  notice-worker:
    profiles: ["email"]
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.notification_worker"]
    init: true
    environment:
      <<: *notice-environment
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://muefs:muefs_dev@postgres:5432/muefs}
      DEBUG: ${DEBUG:-true}
      ALLOW_DEMO_MODE: ${ALLOW_DEMO_MODE:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_ALLOW_DEMO_MODE: ${VITE_ALLOW_DEMO_MODE:-true}
      VITE_DEMO_MODE_SECRET: ${VITE_DEMO_MODE_SECRET:-}
      API_PROXY_TARGET: http://backend:8000
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-muefs}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-muefs-frontend}

  clamav:
    image: clamav/clamav:1.4
    profiles: ["security"]
    volumes:
      - clamav_data:/var/lib/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./clamav/muefs-limits.cdb:/var/lib/clamav/muefs-limits.cdb

volumes:
  postgres_data:
  redis_data:
  storage_data:
  clamav_data:
