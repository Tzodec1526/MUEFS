# Stable front door → ephemeral Cloudflare quick tunnel.
# Usage: npx wrangler deploy -c wrangler.proxy.toml
# ORIGIN in src/proxy.js must match the running quick-tunnel hostname.
#
# NOTE: demo.tomcedoz.com cannot be a Workers custom domain while it CNAMEs to
# Render (externally managed DNS / orange-to-orange). Use webmcp.tomcedoz.com,
# muefs.tomcedoz.com, or Manual Deploy on Render for the canonical host.
name = "muefs-webmcp-live"
main = "src/proxy.js"
compatibility_date = "2026-08-01"
account_id = "72b88976acc5bc6d8cae287f05bde80a"
workers_dev = true

[[routes]]
pattern = "webmcp.tomcedoz.com"
custom_domain = true

[[routes]]
pattern = "muefs.tomcedoz.com"
custom_domain = true

