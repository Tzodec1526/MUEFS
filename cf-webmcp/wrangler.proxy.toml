# Stable front door → ephemeral Cloudflare quick tunnel.
# Usage: npx wrangler deploy -c wrangler.proxy.toml
# ORIGIN in src/proxy.js must match the running quick-tunnel hostname.
#
# NOTE: Do not attach demo.tomcedoz.com/* as a Worker route while it CNAMEs to
# Render (orange-to-orange) — traffic still hits Render. Use webmcp.tomcedoz.com
# or Manual Deploy on Render for the canonical host.
name = "muefs-webmcp-live"
main = "src/proxy.js"
compatibility_date = "2026-08-01"
account_id = "72b88976acc5bc6d8cae287f05bde80a"
workers_dev = true

[[routes]]
pattern = "webmcp.tomcedoz.com"
custom_domain = true
